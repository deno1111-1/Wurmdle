<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>FoxiMax</title>
    <style>
        :root {
            --bg-dark: #121212;
            --bg-panel: #1e1e1e;
            --text-main: #ffffff;
            --text-muted: #a1a1aa;
            --accent-green: #538d4e;
            --accent-green-hover: #4a7538;
            --key-bg: #818384;
            --key-bg-dark: #3a3a3c;
            --border-color: #3a3a3c;
            --wrong-red: #c94f4f;
            --font-main: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-family: var(--font-main);
            display: flex;
            flex-direction: column;
            height: 100vh;
            -webkit-tap-highlight-color: transparent;
            overflow: hidden;
        }

        /* Top Bar / Header */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 16px;
            border-bottom: 1px solid var(--border-color);
            background-color: var(--bg-dark);
        }

        .top-bar .logo {
            color: var(--accent-green);
            font-weight: bold;
            font-size: 18px;
            text-decoration: none;
        }

        .top-bar .nav-buttons {
            display: flex;
            gap: 8px;
        }

        .btn-nav {
            background: #2a2a2a;
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 8px 12px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: background 0.2s;
        }

        .btn-nav:hover { background: #3a3a3c; }

        /* Screens */
        .container {
            flex: 1;
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
        }

        .screen {
            display: none;
            flex-direction: column;
            height: 100%;
            padding: 20px;
            align-items: center;
            overflow-y: auto;
            width: 100%;
        }

        .screen.active {
            display: flex;
        }

        /* Setup Screen */
        h1 {
            font-size: 24px;
            margin-bottom: 30px;
            text-align: center;
        }

        .setup-group {
            margin-bottom: 25px;
            width: 100%;
            max-width: 320px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .setup-label {
            display: block;
            margin-bottom: 10px;
            color: var(--text-main);
            font-size: 16px;
        }

        .toggle-group {
            display: flex;
            background: #2a2a2a;
            border-radius: 12px;
            overflow: hidden;
            width: 100%;
        }

        .toggle-btn {
            flex: 1;
            padding: 14px;
            border: none;
            background: transparent;
            color: #888;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
            transition: 0.2s;
        }

        .toggle-btn.active {
            background: var(--accent-green);
            color: white;
        }

        .input-field {
            background: var(--bg-dark);
            border: 2px solid var(--accent-green);
            color: white;
            padding: 12px;
            border-radius: 12px;
            width: 100%;
            max-width: 150px;
            text-align: center;
            font-size: 20px;
            font-weight: bold;
            outline: none;
            -moz-appearance: textfield;
        }
        
        .input-field::-webkit-outer-spin-button,
        .input-field::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }

        .status-text {
            color: var(--text-muted);
            margin-top: 10px;
            font-size: 14px;
        }

        .btn-start {
            background: var(--accent-green);
            color: white;
            border: none;
            padding: 16px 40px;
            border-radius: 30px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 20px;
            width: 100%;
            max-width: 250px;
            transition: background 0.2s;
        }
        
        .btn-start:hover {
            background: var(--accent-green-hover);
        }

        /* Game Screen */
        .game-header-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            max-width: 450px;
            background: var(--bg-panel);
            padding: 12px 16px;
            border-radius: 12px 12px 0 0;
            border: 1px solid var(--border-color);
            border-bottom: none;
            margin-top: 10px;
        }

        .game-title { font-weight: bold; font-size: 14px; color: var(--text-muted); }
        .hint-btn { background: transparent; border: none; font-size: 22px; cursor: pointer; }

        .board-container {
            flex: 1;
            width: 100%;
            max-width: 450px;
            background: var(--bg-panel);
            border: 1px solid var(--border-color);
            border-top: none;
            border-radius: 0 0 12px 12px;
            margin-bottom: 20px;
            overflow-y: auto;
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .word-row {
            display: flex;
            justify-content: center;
            gap: 6px;
        }

        .letter-box {
            width: 45px;
            height: 45px;
            border: 2px solid var(--border-color);
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 24px;
            font-weight: bold;
            text-transform: uppercase;
            color: var(--text-main);
            background-color: var(--bg-dark);
            border-radius: 4px;
        }

        .letter-box.revealed {
            border-color: var(--accent-green);
            background-color: var(--bg-dark);
            color: white;
            animation: popIn 0.2s;
        }

        @keyframes popIn {
            0% { transform: scale(0.8); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        .stats-row {
            display: flex;
            justify-content: space-between;
            width: 100%;
            max-width: 450px;
            margin-bottom: 10px;
            font-size: 14px;
            color: var(--text-muted);
        }
        .stats-row span { color: white; font-weight: bold; }

        /* Keyboard */
        .keyboard {
            width: 100%;
            max-width: 500px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            padding-bottom: 20px;
        }

        .kbd-row {
            display: flex;
            justify-content: center;
            gap: 6px;
            width: 100%;
        }

        .key {
            flex: 1;
            height: 54px;
            background: var(--key-bg);
            border-radius: 4px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: bold;
            font-size: 16px;
            color: white;
            cursor: pointer;
            user-select: none;
            transition: background 0.1s;
        }

        .key.wide {
            flex: 1.5;
            font-size: 14px;
        }

        .key.correct {
            background: var(--accent-green);
            pointer-events: none;
        }

        .key.wrong {
            background: var(--key-bg-dark);
            pointer-events: none;
            opacity: 0.6;
        }

        /* Result Screen */
        .summary-box {
            background: var(--bg-panel);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 20px;
            width: 100%;
            max-width: 320px;
            margin-top: 20px;
            text-align: center;
        }

        .result-title { font-size: 28px; margin-bottom: 15px; }
        .win-text { color: var(--accent-green); }
        .lose-text { color: var(--wrong-red); }
        .summary-word { font-size: 18px; margin: 8px 0; letter-spacing: 2px; font-family: monospace; }
        
    </style>
</head>
<body>

    <!-- Header -->
    <div class="top-bar">
        <div class="logo">😼Miau Multiplikation</div>
        <div class="nav-buttons" id="nav-buttons">
            <a href="index.html" class="btn-nav">🏠 HAUPTMENÜ</a>
        </div>
    </div>

    <div class="container">
        
        <!-- Setup Screen -->
        <div id="screen-setup" class="screen active">
            <h1>Miau Setup</h1>
            
            <div class="setup-group">
                <span class="setup-label">Sprache</span>
                <div class="toggle-group">
                    <button class="toggle-btn" id="lang-de" onclick="setLang('de')">DEUTSCH</button>
                    <button class="toggle-btn active" id="lang-en" onclick="setLang('en')">ENGLISH</button>
                </div>
            </div>

            <div class="setup-group">
                <span class="setup-label">Maximale Fehler</span>
                <input type="number" id="input-mistakes" class="input-field" min="3" max="25" value="8">
            </div>

            <div class="status-text">Bereit.</div>

            <button class="btn-start" onclick="startGame()">STARTEN</button>
        </div>

        <!-- Game Screen -->
        <div id="screen-game" class="screen">
            <div class="stats-row">
                <div>Fehler: <span id="stat-mistakes">0</span> / <span id="stat-max">8</span></div>
                <div>Wörter: <span id="stat-pool">1</span></div>
            </div>

            <div class="game-header-info">
                <div class="game-title">SPIEL 1</div>
                <button class="hint-btn" onclick="useHint()">💡</button>
            </div>

            <div class="board-container" id="board">
                <!-- Word grid inject here -->
            </div>

            <div class="keyboard" id="keyboard">
                <!-- Keyboard inject here -->
            </div>
        </div>

        <!-- End Screen -->
        <div id="screen-end" class="screen">
            <h1 id="result-title" class="result-title"></h1>
            <div class="summary-box">
                <div class="setup-label">Lösungswörter:</div>
                <div id="summary-words"></div>
            </div>
            <button class="btn-start" onclick="showSetup()">NEUES SPIEL</button>
        </div>

    </div>

    <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
    <script src="stats.js"></script>
    <script>
        // --- Fallback Data ---
        const fallbacks = {
            de: ["WALD", "FUCHS", "APFEL", "BAUM", "STURM", "WOLKE", "SPIEL", "STRAND", "HERBST", "BLUME", "KATZE", "VOGEL", "FENSTER", "FLUSS", "BERGE"],
            en: ["FOXES", "APPLE", "BEACH", "CLOUD", "STORM", "PLANT", "HOUSE", "TRAIN", "FLOWER", "BIRD", "WATER", "SMART", "LIGHT", "NIGHT", "GRASS"]
        };

        const keyboardLayout = [
            ["Q","W","E","R","T","Z","U","I","O","P"],
            ["A","S","D","F","G","H","J","K","L"],
            ["Y","X","C","V","B","N","M"]
        ];

        // --- State ---
        let currentLang = 'en'; // Default to English
        let maxMistakes = 8;
        let mistakes = 0;
        let wordList = [];
        let activeWords = [];
        let guessedLetters = new Set();

        // --- Init LocalStorage ---
        window.onload = () => {
            const savedMistakes = localStorage.getItem('foximax_mistakes');
            if (savedMistakes) {
                document.getElementById('input-mistakes').value = savedMistakes;
            }
            
            // Listen to input changes to save automatically
            document.getElementById('input-mistakes').addEventListener('input', (e) => {
                let val = parseInt(e.target.value);
                if(val > 0) localStorage.setItem('foximax_mistakes', val);
            });
        };

        // --- Setup Logic ---
        function setLang(lang) {
            currentLang = lang;
            document.getElementById('lang-de').classList.toggle('active', lang === 'de');
            document.getElementById('lang-en').classList.toggle('active', lang === 'en');
        }

        async function startGame() {
            maxMistakes = parseInt(document.getElementById('input-mistakes').value) || 8;
            mistakes = 0;
            activeWords = [];
            guessedLetters.clear();
            startGameTimer();

            await loadWords();
            addWordToPool();
            buildKeyboard();
            updateBoard();
            updateHeader(true);
            switchScreen('screen-game');
        }

        async function loadWords() {
            const url = currentLang === 'de' ? 'de.txt' : 'en_5letter_ohnekomische.txt';
            try {
                const response = await fetch(url);
                if (!response.ok) throw new Error("Fetch failed");
                const text = await response.text();
                wordList = text.split('\n')
                            .map(w => w.trim().toUpperCase())
                            .filter(w => w.length >= 4 && w.length <= 8 && /^[A-ZÄÖÜß]+$/.test(w));
                if (wordList.length === 0) throw new Error("Empty list");
            } catch (e) {
                wordList = [...fallbacks[currentLang]];
            }
        }

        // --- Game Logic ---
        function addWordToPool() {
            if(wordList.length === 0) return;
            const randomIndex = Math.floor(Math.random() * wordList.length);
            const newWord = wordList.splice(randomIndex, 1)[0];
            activeWords.push(newWord);
        }

        function handleGuess(letter) {
            if (guessedLetters.has(letter) || mistakes >= maxMistakes) return;

            guessedLetters.add(letter);
            
            let isCorrect = false;
            activeWords.forEach(word => {
                if (word.includes(letter)) isCorrect = true;
            });

            const keyEl = document.querySelector(`.key[data-letter="${letter}"]`);

            if (isCorrect) {
                if (keyEl) keyEl.classList.add('correct');
            } else {
                if (keyEl) keyEl.classList.add('wrong');
                mistakes++;
                addWordToPool(); // System penalty
            }

            updateBoard();
            checkWinCondition();
        }

        function useHint() {
            let validHintLetters = [];
            activeWords.forEach(word => {
                for (let char of word) {
                    if (!guessedLetters.has(char)) validHintLetters.push(char);
                }
            });

            if (validHintLetters.length > 0) {
                const randomHint = validHintLetters[Math.floor(Math.random() * validHintLetters.length)];
                guessedLetters.add(randomHint);
                const keyEl = document.querySelector(`.key[data-letter="${randomHint}"]`);
                if (keyEl) keyEl.classList.add('correct');
                
                updateBoard();
                checkWinCondition();
            }
        }

        function checkWinCondition() {
            if (mistakes >= maxMistakes) {
                endGame(false);
                return;
            }

            let allSolved = true;
            activeWords.forEach(word => {
                for (let char of word) {
                    if (!guessedLetters.has(char)) allSolved = false;
                }
            });

            if (allSolved && activeWords.length > 0) {
                endGame(true);
            }
        }

        function endGame(isWin) {
            const title = document.getElementById('result-title');
            recordGameResult('miaumultiplikation', {won: isWin, guesses: 1, maxGuesses: 1, extra: {mistake_sum: mistakes, words_solved: activeWords.length}});
            if (isWin) {
                title.textContent = currentLang === 'de' ? "SUPER LENI HAT GEWONNEN!" : "YOU WIN!";
                title.className = "result-title win-text";
            } else {
                title.textContent = "GAME OVER";
                title.className = "result-title lose-text";
            }

            const summary = document.getElementById('summary-words');
            summary.innerHTML = '';
            activeWords.forEach(word => {
                const div = document.createElement('div');
                div.className = 'summary-word';
                div.textContent = word;
                summary.appendChild(div);
            });

            updateHeader(false);
            switchScreen('screen-end');
        }

        // --- Rendering ---
        function buildKeyboard() {
            const kbContainer = document.getElementById('keyboard');
            kbContainer.innerHTML = '';
            keyboardLayout.forEach(row => {
                const rowDiv = document.createElement('div');
                rowDiv.className = 'kbd-row';
                row.forEach(letter => {
                    const key = document.createElement('div');
                    key.className = 'key';
                    key.textContent = letter;
                    key.dataset.letter = letter;
                    key.onclick = () => handleGuess(letter);
                    rowDiv.appendChild(key);
                });
                kbContainer.appendChild(rowDiv);
            });
        }

        function updateBoard() {
            document.getElementById('stat-mistakes').textContent = mistakes;
            document.getElementById('stat-max').textContent = maxMistakes;
            document.getElementById('stat-pool').textContent = activeWords.length;

            const board = document.getElementById('board');
            board.innerHTML = '';
            
            activeWords.forEach(word => {
                const wordRow = document.createElement('div');
                wordRow.className = 'word-row';
                for (let char of word) {
                    const box = document.createElement('div');
                    box.className = 'letter-box';
                    // Auto reveal logic: if guessed, show it (even for newly added words)
                    if (guessedLetters.has(char)) {
                        box.textContent = char;
                        box.classList.add('revealed');
                    }
                    wordRow.appendChild(box);
                }
                board.appendChild(wordRow);
            });

            board.scrollTop = board.scrollHeight; // Auto-scroll to latest word
        }

        // --- Navigation ---
        function updateHeader(inGame) {
            const nav = document.getElementById('nav-buttons');
            if (inGame) {
                nav.innerHTML = `
                    <button class="btn-nav" onclick="showSetup()">↩️ ZURÜCK</button>
                    <a href="index.html" class="btn-nav">🏠 HAUPTMENÜ</a>
                `;
            } else {
                nav.innerHTML = `<a href="index.html" class="btn-nav">🏠 HAUPTMENÜ</a>`;
            }
        }

        function showSetup() {
            updateHeader(false);
            switchScreen('screen-setup');
        }

        function switchScreen(id) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(id).classList.add('active');
        }
    </script>
</body>
</html>
