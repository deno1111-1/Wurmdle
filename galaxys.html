<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Galaxies Puzzle</title>

<style>
body{
  margin:0;
  font-family:sans-serif;
  background:#f0f0f0;
  display:flex;
  flex-direction:column;
  align-items:center;
}

#menu{
  padding:15px;
  display: flex;
  gap: 10px;
  align-items: center;
  flex-wrap: wrap;
  justify-content: center;
}

#menu button {
  padding: 8px 14px;
  cursor: pointer;
  border: 2px solid #ccc;
  border-radius: 6px;
  background: white;
  font-weight: bold;
}

#board{
  display:grid;
  width:95vw;
  max-width:600px;
  aspect-ratio:1;
  background:white;
  touch-action: pinch-zoom; 
  position:relative;
}

.cell{
  border:1px solid #ccc;
  box-sizing:border-box;
}

.cell.dead {
  background: #555 !important;
  border: 1px solid #333 !important;
  pointer-events: none; 
}

.center-dot{
  position:absolute;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: calc(min(95vw, 600px) / var(--size, 8) * 0.45);
  transform:translate(-50%,-50%);
  pointer-events:none;
}

#message{
  margin:15px;
  font-weight:bold;
  color:#333;
  text-align: center;
  max-width: 600px;
  padding: 0 10px;
}
</style>
</head>
<body>

<div id="menu">
  <button onclick="window.location.href='index.html'" style="background:#555; color:white; border-color:#333;">🏠 Hauptmenü</button>
  
  <label style="font-weight: bold;">Größe: <input type="number" id="sizeInput" value="8" min="5" max="14" style="width: 50px; font-size:1rem; padding:4px;"></label>
  <button id="startBtn" style="background:#4a90e2; color:white; border-color:#357abd;">Neues Spiel</button>
  <button id="solveBtn">Lösung</button>
  <button id="undoBtn">↩️ Zurück</button>
  <button id="eraserBtn">Radierer: Aus</button>
</div>

<div id="board"></div>
<div id="message">Schaffst du es die Glubschgalaxien zu lösen und der ultimative Glubscher zu sein?</div>

<div id="winOverlay" style="
 position:fixed;
 inset:0;
 background:rgba(0, 0, 0, 0.7);
 display:none;
 flex-direction: column;
 justify-content:center;
 align-items:center;
 color:white;
 z-index:1000;
 text-align: center;
 padding: 20px;
">
 <div style="font-size:36px; font-weight:bold; margin-bottom: 20px; line-height: 1.2;">🎉Juppie!<br>Leni ist der ultimative Glubscher!🎉</div>
 <div style="display: flex; gap: 15px; justify-content: center; flex-wrap: wrap;">
     <button onclick="window.location.href='index.html'" style="padding: 15px 30px; font-size: 20px; border-radius: 10px; cursor: pointer; border: none; background: #555; color: white; font-weight: bold;">🏠 Hauptmenü</button>
     <button onclick="startGame()" style="padding: 15px 30px; font-size: 20px; border-radius: 10px; cursor: pointer; border: none; background: #4a90e2; color: white; font-weight: bold;">Nächstes Level</button>
 </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
<script src="stats.js"></script>
<script>

const boardEl = document.getElementById("board");
const messageEl = document.getElementById("message");
const sizeInput = document.getElementById("sizeInput");
const startBtn = document.getElementById("startBtn");
const solveBtn = document.getElementById("solveBtn");
const eraserBtn = document.getElementById("eraserBtn");
const undoBtn = document.getElementById("undoBtn");

let size;
let solution=[];
let player=[];
let centers=[];
let history=[]; 
let dragging=false;
let activeId=null;
let eraserMode = false;

let lastR = null;
let lastC = null;
let galaxysUndoCount = 0;
let galaxysLevel = 1;

function randomColor(){
  return `hsl(${Math.random()*360}, 65%, 70%)`;
}

function clonePlayerState() {
  return player.map(row => [...row]);
}

startBtn.onclick = startGame;

solveBtn.onclick = () => {
  history.push(clonePlayerState()); 
  for(let r=0; r<size; r++){
    for(let c=0; c<size; c++){
      if(solution[r][c] !== "DEAD") {
        player[r][c] = solution[r][c];
      }
    }
  }
  updateBoard();
  checkWin();
};

undoBtn.onclick = () => {
  if (history.length > 0) {
    player = history.pop(); 
    galaxysUndoCount++;
    updateBoard();
  }
};

eraserBtn.onclick = () => {
  eraserMode = !eraserMode;
  if(eraserMode) {
    eraserBtn.innerText = "Radierer: An";
    eraserBtn.style.background = "#ef4444";
    eraserBtn.style.color = "white";
    eraserBtn.style.borderColor = "#dc2626";
  } else {
    eraserBtn.innerText = "Radierer: Aus";
    eraserBtn.style.background = "white";
    eraserBtn.style.color = "black";
    eraserBtn.style.borderColor = "#ccc";
  }
};

function startGame(){
  size = parseInt(sizeInput.value);
  document.getElementById("winOverlay").style.display = "none";
  galaxysUndoCount = 0;
  startGameTimer();
  
  eraserMode = false;
  eraserBtn.innerText = "Radierer: Aus";
  eraserBtn.style.background = "white";
  eraserBtn.style.color = "black";
  eraserBtn.style.borderColor = "#ccc";

  history = []; 

  generatePuzzle(size);
  renderBoard();
}

function generatePuzzle(n){
  solution = Array.from({length:n},()=>Array(n).fill(null));
  player   = Array.from({length:n},()=>Array(n).fill(null));
  centers=[];

  function inside(r,c){ return r>=0 && r<n && c>=0 && c<n; }

  // 1. Organische "tote" Zonen an den Rändern für eine spannende Spielfeldform schaffen
  let deadCount = Math.floor(n * n * (0.1 + Math.random() * 0.15)); // 10-25% schwarze Felder
  let deadFrontier = [];
  
  for(let i=0; i<n; i++) {
      if(Math.random() < 0.25) deadFrontier.push([0, i]);
      if(Math.random() < 0.25) deadFrontier.push([n-1, i]);
      if(Math.random() < 0.25) deadFrontier.push([i, 0]);
      if(Math.random() < 0.25) deadFrontier.push([i, n-1]);
  }
  
  let actualDead = 0;
  while(deadFrontier.length > 0 && actualDead < deadCount) {
      let idx = Math.floor(Math.random() * deadFrontier.length);
      let [r, c] = deadFrontier.splice(idx, 1)[0];
      
      if(solution[r][c] === null) {
          solution[r][c] = "DEAD";
          actualDead++;
          
          let dirs = [[1,0],[-1,0],[0,1],[0,-1]];
          for(let [dr, dc] of dirs) {
              let nr = r+dr, nc = c+dc;
              if(inside(nr, nc) && solution[nr][nc] === null) {
                  deadFrontier.push([nr, nc]);
              }
          }
      }
  }

  // 2. Startpunkte für die Galaxien setzen
  let id = 0;
  let targetGalaxies = Math.floor((n * n - actualDead) / 10); // Dynamische Dichte
  if (targetGalaxies < 3) targetGalaxies = 3;

  function findRandomEmpty(){
    let empties = [];
    for(let r=0;r<n;r++){
      for(let c=0;c<n;c++){
        if(solution[r][c]===null) empties.push([r,c]);
      }
    }
    if(empties.length === 0) return null;
    return empties[Math.floor(Math.random() * empties.length)];
  }

  let activeFrontiers = [];

  for(let i=0; i<targetGalaxies; i++) {
      let start = findRandomEmpty();
      if(!start) break;
      let [sr, sc] = start;
      let center = {
        x: sc + 0.5,
        y: sr + 0.5,
        id: id,
        color: randomColor(),
        emoji: "👁️"
      };
      centers.push(center);
      solution[sr][sc] = id;
      activeFrontiers.push({id: id, center: center, cells: [[sr, sc]]});
      id++;
  }

  // 3. Gleichzeitiges, organisches Wachstum aller Galaxien
  let growing = true;
  while(growing) {
      growing = false;
      // Shuffle um keine Galaxie zu bevorzugen
      activeFrontiers.sort(() => Math.random() - 0.5);

      for(let f of activeFrontiers) {
          if(f.cells.length === 0) continue;
          
          let idx = Math.floor(Math.random() * f.cells.length);
          let [r, c] = f.cells.splice(idx, 1)[0];
          
          let dirs = [[1,0],[-1,0],[0,1],[0,-1]].sort(() => Math.random() - 0.5);
          let expanded = false;

          for(let [dr, dc] of dirs) {
              let nr = r + dr; 
              let nc = c + dc;
              let symR = 2 * f.center.y - nr - 1; 
              let symC = 2 * f.center.x - nc - 1;

              if(Number.isInteger(symR) && Number.isInteger(symC)){
                  if(inside(nr, nc) && inside(symR, symC)){
                      if(solution[nr][nc] === null && solution[symR][symC] === null){
                          solution[nr][nc] = f.id; 
                          solution[symR][symC] = f.id;
                          f.cells.push([nr, nc]); 
                          if (nr !== symR || nc !== symC) f.cells.push([symR, symC]);
                          expanded = true;
                          growing = true;
                          break; 
                      }
                  }
              }
          }
          if(expanded) f.cells.push([r, c]); 
      }
  }

  // 4. Lücken füllen (übrig gebliebene Zellen sinnvoll verarbeiten)
  let emptyCells = true;
  while(emptyCells) {
      emptyCells = false;
      let empties = [];
      for(let r=0;r<n;r++){
          for(let c=0;c<n;c++){
              if(solution[r][c]===null) empties.push([r,c]);
          }
      }
      
      if(empties.length === 0) break;
      emptyCells = true;

      empties.sort(() => Math.random() - 0.5);
      let assigned = false;

      for(let [r, c] of empties) {
          let attached = false;
          for(let g of centers){
              let symR = 2*g.y - r - 1; 
              let symC = 2*g.x - c - 1;
              if(Number.isInteger(symR) && Number.isInteger(symC) && inside(symR, symC)){
                  if(solution[symR][symC] === null){
                      let isAdj = false;
                      let dirs = [[1,0],[-1,0],[0,1],[0,-1]];
                      for(let [dr, dc] of dirs) {
                          if((inside(r+dr, c+dc) && solution[r+dr][c+dc] === g.id) || 
                             (inside(symR+dr, symC+dc) && solution[symR+dr][symC+dc] === g.id)) {
                              isAdj = true;
                              break;
                          }
                      }
                      if(isAdj) {
                          solution[r][c] = g.id; 
                          solution[symR][symC] = g.id;
                          attached = true;
                          assigned = true;
                          break;
                      }
                  }
              }
          }
          if(attached) continue;
      }

      if(!assigned) {
          let [r, c] = empties[0];
          if(Math.random() < 0.4) {
              let newId = centers.length;
              centers.push({ x: c + 0.5, y: r + 0.5, id: newId, color: randomColor(), emoji: "👁️" });
              solution[r][c] = newId;
          } else {
              solution[r][c] = "DEAD";
          }
      }
  }
}

function isCenter(r, c) {
  return centers.some(g => Math.floor(g.y) === r && Math.floor(g.x) === c);
}

function getCenterId(r, c) {
  let g = centers.find(g => Math.floor(g.y) === r && Math.floor(g.x) === c);
  return g ? g.id : null;
}

function floodFillMarked(startR, startC, newId) {
  if (startR === null || startC === null) return;
  if (player[startR][startC] !== "MARKED") return; 
  
  let queue = [[startR, startC]];
  player[startR][startC] = newId; 

  while(queue.length > 0) {
    let [r, c] = queue.shift();
    let dirs = [[1,0],[-1,0],[0,1],[0,-1]];
    for(let [dr, dc] of dirs) {
      let nr = r + dr, nc = c + dc;
      if(nr >= 0 && nr < size && nc >= 0 && nc < size) {
        if(player[nr][nc] === "MARKED") {
          player[nr][nc] = newId;
          queue.push([nr, nc]);
        }
      }
    }
  }
}

function renderBoard(){
  boardEl.innerHTML="";
  boardEl.style.setProperty('--size', size); 
  boardEl.style.gridTemplateColumns=`repeat(${size},1fr)`;

  for(let r=0;r<size;r++){
    for(let c=0;c<size;c++){
      let cell=document.createElement("div");
      cell.className="cell";
      
      if(solution[r][c] === "DEAD") {
        cell.classList.add("dead");
        player[r][c] = "DEAD"; 
      } else if (isCenter(r, c)) {
        player[r][c] = getCenterId(r, c); 
      } else {
        player[r][c] = null; 
      }

      cell.dataset.r=r;
      cell.dataset.c=c;
      boardEl.appendChild(cell);
    }
  }

  centers.forEach(center=>{
    let dot=document.createElement("div");
    dot.className="center-dot";
    dot.innerText = center.emoji; 
    dot.style.left=(center.x/size*100)+"%";
    dot.style.top=(center.y/size*100)+"%";
    boardEl.appendChild(dot);
  });

  updateBoard();
}

boardEl.addEventListener("pointerdown", e => {
  if (!e.isPrimary) {
      dragging = false;
      return;
  }

  if(!e.target.classList.contains("cell")) return;
  
  let r=parseInt(e.target.dataset.r);
  let c=parseInt(e.target.dataset.c);
  
  if(solution[r][c] === "DEAD") return; 

  boardEl.setPointerCapture(e.pointerId);

  if(eraserMode) {
    history.push(clonePlayerState()); 
    activeId = "ERASE";
    dragging = true;
    if(!isCenter(r, c)) { 
      player[r][c] = null;
      updateBoard();
    }
  } else {
    let currentId = player[r][c];
    if (currentId === null || currentId === "MARKED") {
      history.push(clonePlayerState()); 
      activeId = "MARKED"; 
      dragging = true;
      player[r][c] = "MARKED";
      updateBoard();
    } else if (currentId !== "DEAD") {
      history.push(clonePlayerState()); 
      activeId = currentId; 
      dragging = true;
    }
  }
  
  lastR = r;
  lastC = c;
});

document.addEventListener("pointermove", e => {
  if(!dragging) return;
  
  if (!e.isPrimary) {
      dragging = false;
      return;
  }

  let el = document.elementFromPoint(e.clientX, e.clientY);
  if(!el || !el.classList.contains("cell")) return;

  let r=parseInt(el.dataset.r);
  let c=parseInt(el.dataset.c);

  if(r === lastR && c === lastC) return;
  if(solution[r][c] === "DEAD") return; 

  let targetId = player[r][c];

  if(activeId === "ERASE") {
    if(!isCenter(r, c)) {
      player[r][c] = null;
      updateBoard();
    }
  } else if (activeId === "MARKED") {
    if (targetId === null) {
        player[r][c] = "MARKED";
        updateBoard();
    } else if (typeof targetId === "number") {
        floodFillMarked(lastR, lastC, targetId);
        activeId = targetId; 
        updateBoard();
    }
  } else if (typeof activeId === "number") {
    if (targetId === null) {
        player[r][c] = activeId;
        updateBoard();
    } else if (targetId === "MARKED") {
        floodFillMarked(r, c, activeId);
        updateBoard();
    } else if (typeof targetId === "number" && targetId !== activeId) {
        if(!isCenter(r, c)) {
            player[r][c] = activeId;
            updateBoard();
        }
    }
  }
  
  lastR = r;
  lastC = c;
});

window.addEventListener("pointerup",()=>{
  if(dragging) {
    dragging=false;
    checkWin();
  }
});

function updateBoard(){

  document.querySelectorAll(".cell").forEach(cell=>{
    let r=parseInt(cell.dataset.r);
    let c=parseInt(cell.dataset.c);
    let id=player[r][c];

    if(id === "DEAD") return; 

    if(id === "MARKED") {
      cell.style.background = "#e2e8f0"; 
    } else if(id !== null){
      let g = centers.find(x => x.id === id);
      if(g) cell.style.background = g.color;
    } else {
      cell.style.background = ""; 
    }
  });

  drawBorders();
}

function drawBorders(){

  document.querySelectorAll(".cell").forEach(cell=>{
    let r=parseInt(cell.dataset.r);
    let c=parseInt(cell.dataset.c);
    let id=player[r][c];

    let top    = r===0 || (player[r-1][c]!==id && (id !== null || player[r-1][c] !== null));
    let bottom = r===size-1 || (player[r+1][c]!==id && (id !== null || player[r+1][c] !== null));
    let left   = c===0 || (player[r][c-1]!==id && (id !== null || player[r][c-1] !== null));
    let right  = c===size-1 || (player[r][c+1]!==id && (id !== null || player[r][c+1] !== null));

    cell.style.borderTop    = top    ? "3px solid #222" : "1px solid #ccc";
    cell.style.borderBottom = bottom ? "3px solid #222" : "1px solid #ccc";
    cell.style.borderLeft   = left   ? "3px solid #222" : "1px solid #ccc";
    cell.style.borderRight  = right  ? "3px solid #222" : "1px solid #ccc";
  });
}

function checkWin() {
  
  for (let r = 0; r < size; r++) {
    for (let c = 0; c < size; c++) {
      if (solution[r][c] !== "DEAD" && (player[r][c] === null || player[r][c] === "MARKED")) return;
    }
  }
  
  for (let g of centers) {
    for (let r = 0; r < size; r++) {
      for (let c = 0; c < size; c++) {
        if (player[r][c] === g.id) {
          let symR = 2 * g.y - r - 1;
          let symC = 2 * g.x - c - 1;
          
          if (!Number.isInteger(symR) || !Number.isInteger(symC)) return;
          if (symR < 0 || symR >= size || symC < 0 || symC >= size) return;
          if (player[symR][symC] !== g.id) return;
        }
      }
    }
  }
  
  document.getElementById("winOverlay").style.display = "flex";
  recordGameResult('galaxys', {won: true, guesses: 1, maxGuesses: 1, extra: {undo_sum: galaxysUndoCount, levels_completed: 1}});
}

startGame();

</script>
</body>
</html>
