<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
    <title>Kloßis Leckerlijagd</title>
    <style>
        /* --- GLOBAL --- */
        body {
            background-color: #222; color: white;
            font-family: 'Comic Sans MS', 'Chalkboard SE', sans-serif;
            margin: 0; display: flex; flex-direction: column; align-items: center;
            height: 100vh; overflow: hidden; user-select: none;
            touch-action: none;
        }

        /* HEADER */
        header {
            display: flex; align-items: center; justify-content: space-between;
            width: 100%; padding: 10px 15px; background: #121213; box-sizing: border-box;
            border-bottom: 1px solid #333; height: 60px; z-index: 10;
        }
        h1 { margin: 0; font-size: 1.0rem; color: #ff69b4; text-shadow: 1px 1px 0 #000; }
        .menu-btn {
            background: #333; color: white; border: 1px solid #555; text-decoration: none;
            padding: 8px 12px; border-radius: 5px; cursor: pointer; font-weight: bold; font-size: 0.8rem;
        }

        /* --- ALLGEMEINE CONTROLS --- */
        .game-area {
            flex-grow: 1; width: 100%; display: flex; flex-direction: column;
            align-items: center; padding: 10px; box-sizing: border-box; overflow-y: auto;
        }
        .action-btn {
            border: 1px solid #555; background: #333; color: white;
            padding: 12px 20px; border-radius: 25px; font-weight: bold; cursor: pointer; font-size: 1rem;
        }

        #msg-toast { position: fixed; top: 20%; left: 50%; transform: translateX(-50%); background: white; color: black; padding: 15px 30px; border-radius: 30px; font-weight: bold; display: none; z-index: 2000; text-align: center; }

        /* --- KLOSSIS LECKERLIJAGD --- */
        .klossi-score-board { display: flex; gap: 20px; margin-bottom: 10px; margin-top: 10px; width: 100%; justify-content: center; }
        .score-box { background: #333; padding: 10px 20px; border-radius: 10px; text-align: center; border: 2px solid transparent; min-width: 80px;}
        .score-box.active { border-color: white; background: #444; transform: scale(1.05); transition: all 0.2s; }
        .p-score { color: #ff69b4; font-weight: bold; font-size: 1.5rem; }
        .b-score { color: #ffd700; font-weight: bold; font-size: 1.5rem; }
        #dots-canvas-container { position: relative; margin: 0 auto; touch-action: none; display: flex; justify-content: center;}
        #turn-indicator { margin-bottom: 15px; font-weight: bold; color: #aaa; min-height: 20px;}
    </style>
</head>
<body>

    <header>
        <h1>🐈 Kloßis Leckerlijagd</h1>
        <a href="index.html" class="menu-btn">HAUPTMENÜ</a>
    </header>

    <div id="msg-toast">Nachricht</div>

    <div id="klossi-area" class="game-area">
        <div class="klossi-score-board">
            <div class="score-box" id="sb-player"><div class="p-score" id="score-p">0</div><div>LENI</div></div>
            <div class="score-box" id="sb-bot"><div class="b-score" id="score-b">0</div><div>KLOẞI</div></div>
        </div>
        <div id="turn-indicator">Du bist dran!</div>
        
        <div id="dots-canvas-container"></div>
        
        <button class="action-btn" style="margin-top:20px;" onclick="startKlossiGame()">NEUES SPIELFELD 🎲</button>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
    <script src="stats.js"></script>
    <script>
        let kDots=8, kH_lines=[], kV_lines=[], kBoxes=[], kTurn=1, kScoreP=0, kScoreB=0, kCanvas=null, kCtx=null, kScale=1;
        const K_SIZE=50;
        let isGameActive = true;

        window.onload = () => {
            startKlossiGame();
        };

        function startKlossiGame(){
            isGameActive = true;
            startGameTimer();
            generateRandomBoard(); 
            
            kTurn=1; kScoreP=0; kScoreB=0;
            const cont=document.getElementById('dots-canvas-container');
            const size=Math.min(window.innerWidth-20, 400);
            kScale=size/((kDots-1)*K_SIZE + 20); 
            
            cont.innerHTML=`<canvas id="kCanvas" width="${size}" height="${size}" style="background:#222; cursor:pointer; touch-action:none;"></canvas>`;
            kCanvas=document.getElementById('kCanvas'); 
            kCtx=kCanvas.getContext('2d'); 
            kCtx.scale(kScale,kScale); 
            kCtx.translate(10,10);
            
            kCanvas.addEventListener('pointerdown', klossiClick); 
            updateKlossiUI(); 
            renderKlossi();
        }

        function generateRandomBoard() {
            const BOXES = 7; 
            kDots = BOXES + 1;
            
            // -2 bedeutet: Außerhalb des Spielfelds (unsichtbar)
            kBoxes = Array.from({length: BOXES}, () => Array(BOXES).fill(-2));
            
            let type = Math.floor(Math.random() * 4); 
            
            if (type === 0) {
                let active = 0; let target = 20 + Math.floor(Math.random() * 8); 
                kBoxes[3][3] = 0; active++;
                while(active < target) {
                    let cands = [];
                    for(let r=0; r<BOXES; r++) {
                        for(let c=0; c<BOXES; c++) {
                            if(kBoxes[r][c] === -2 && ((r>0 && kBoxes[r-1][c]===0) || (r<BOXES-1 && kBoxes[r+1][c]===0) || (c>0 && kBoxes[r][c-1]===0) || (c<BOXES-1 && kBoxes[r][c+1]===0))) {
                                cands.push({r,c});
                            }
                        }
                    }
                    if(cands.length===0) break;
                    let pick = cands[Math.floor(Math.random()*cands.length)];
                    let points = [{r: pick.r, c: pick.c}, {r: 6-pick.r, c: pick.c}, {r: pick.r, c: 6-pick.c}, {r: 6-pick.r, c: 6-pick.c}];
                    for(let p of points) { if(kBoxes[p.r][p.c] === -2) { kBoxes[p.r][p.c] = 0; active++; } }
                }
            } else if (type === 1) {
                let active = 0; let target = 24 + Math.floor(Math.random() * 8);
                kBoxes[3][3] = 0; active++;
                while(active < target) {
                    let cands = [];
                    for(let r=0; r<BOXES; r++) {
                        for(let c=0; c<BOXES; c++) {
                            if(kBoxes[r][c] === -2 && ((r>0 && kBoxes[r-1][c]===0) || (r<BOXES-1 && kBoxes[r+1][c]===0) || (c>0 && kBoxes[r][c-1]===0) || (c<BOXES-1 && kBoxes[r][c+1]===0))) {
                                cands.push({r,c});
                            }
                        }
                    }
                    if(cands.length===0) break;
                    let pick = cands[Math.floor(Math.random()*cands.length)];
                    kBoxes[pick.r][pick.c] = 0; active++;
                }
            } else if (type === 2) {
                let active = 0; let target = 22 + Math.floor(Math.random() * 6);
                let r = Math.floor(Math.random() * 3) + 2; let c = Math.floor(Math.random() * 3) + 2;
                while(active < target) {
                    if(kBoxes[r][c] === -2) { kBoxes[r][c] = 0; active++; }
                    let dirs = [[0,1],[0,-1],[1,0],[-1,0]];
                    let validDirs = dirs.map(d => ({r: r+d[0], c: c+d[1]})).filter(p => p.r>=0 && p.r<BOXES && p.c>=0 && p.c<BOXES);
                    let emptyDirs = validDirs.filter(p => kBoxes[p.r][p.c] === -2);
                    let next = emptyDirs.length > 0 ? emptyDirs[Math.floor(Math.random()*emptyDirs.length)] : validDirs[Math.floor(Math.random()*validDirs.length)];
                    r = next.r; c = next.c;
                }
            } else {
                let shape = Math.floor(Math.random() * 3);
                for(let r=0; r<BOXES; r++) {
                    for(let c=0; c<BOXES; c++) {
                        let dist = Math.abs(r-3) + Math.abs(c-3);
                        if (shape === 0) { if (dist >= 1 && dist <= 3) kBoxes[r][c] = 0; } 
                        else if (shape === 1) { if (r===3 || c===3 || (r>=2 && r<=4 && c>=2 && c<=4)) kBoxes[r][c] = 0; } 
                        else { if (dist <= 3) kBoxes[r][c] = 0; }
                    }
                }
            }

            // Wände (-1) zufällig in das generierte Spielfeld (0) streuen
            for(let r=0; r<BOXES; r++) {
                for(let c=0; c<BOXES; c++) {
                    if(kBoxes[r][c] === 0 && Math.random() < 0.15) {
                        kBoxes[r][c] = -1; 
                    }
                }
            }

            // Linien aktivieren
            kH_lines = Array.from({length: kDots}, () => Array(BOXES).fill(-1));
            kV_lines = Array.from({length: BOXES}, () => Array(kDots).fill(-1));

            for(let r=0; r<kDots; r++) {
                for(let c=0; c<BOXES; c++) {
                    if ((r > 0 && kBoxes[r-1][c] !== -2) || (r < BOXES && kBoxes[r][c] !== -2)) kH_lines[r][c] = 0;
                }
            }
            
            for(let r=0; r<BOXES; r++) {
                for(let c=0; c<kDots; c++) {
                    // BUGFIX: Hier wurde c < kDots abgefragt, statt c < BOXES!
                    if ((c > 0 && kBoxes[r][c-1] !== -2) || (c < BOXES && kBoxes[r][c] !== -2)) kV_lines[r][c] = 0;
                }
            }
        }

        function klossiClick(e){
            if(!isGameActive) return;
            e.preventDefault(); 
            if(kTurn!==1)return; 
            
            const rect=kCanvas.getBoundingClientRect();
            const x=(e.clientX-rect.left)/kScale - 10; 
            const y=(e.clientY-rect.top)/kScale - 10;
            
            let col=Math.round(x/K_SIZE), row=Math.floor(y/K_SIZE);
            if(col>=0 && col<kDots && row>=0 && row<kDots-1 && Math.abs(x-col*K_SIZE)<15 && y>row*K_SIZE+10 && y<(row+1)*K_SIZE-10){
                if(kV_lines[row][col]===0) makeMove('v',row,col,1); 
                return;
            }
            
            col=Math.floor(x/K_SIZE); row=Math.round(y/K_SIZE);
            if(row>=0 && row<kDots && col>=0 && col<kDots-1 && Math.abs(y-row*K_SIZE)<15 && x>col*K_SIZE+10 && x<(col+1)*K_SIZE-10){
                if(kH_lines[row][col]===0) makeMove('h',row,col,1); 
                return;
            }
        }

        function makeMove(type,r,c,who){
            if(type==='h') kH_lines[r][c]=who; else kV_lines[r][c]=who;
            let madePoint=false;
            
            for(let i=0;i<kDots-1;i++){
                for(let j=0;j<kDots-1;j++){
                    if(kBoxes[i][j]===0){
                        if(kH_lines[i][j]>0 && kH_lines[i+1][j]>0 && kV_lines[i][j]>0 && kV_lines[i][j+1]>0){
                            kBoxes[i][j]=who; 
                            madePoint=true; 
                            if(who===1)kScoreP++; else kScoreB++;
                        }
                    }
                }
            }
            
            updateKlossiUI(); renderKlossi();
            let open=0; 
            for(let i=0;i<kDots-1;i++)for(let j=0;j<kDots-1;j++)if(kBoxes[i][j]===0)open++;
            
            if(open===0){
                isGameActive = false;
                const won = kScoreP > kScoreB;
                const diff = Math.abs(kScoreP - kScoreB);
                if(won) showToast("🎉 SUPER LENI HAT GEWONNEN! 🎉"); 
                else if(kScoreB>kScoreP) showToast("KLOẞI HAT GEWONNEN! Er kriegt ein Leckerli!"); 
                else showToast("UNENTSCHIEDEN!"); 
                recordGameResult('klossi', {won: won, guesses: 1, maxGuesses: 1, extra: {point_diff_sum: diff}});
                return;
            }
            
            if(madePoint){
                if(who===2) setTimeout(botMove, 700);
            } else {
                kTurn = (who===1)?2:1; 
                updateKlossiUI(); 
                if(kTurn===2) setTimeout(botMove, 700);
            }
        }

        function botMove(){
            if(!isGameActive) return;
            let moves=[];
            for(let r=0;r<kDots;r++)for(let c=0;c<kDots-1;c++)if(kH_lines[r][c]===0) moves.push({t:'h',r:r,c:c});
            for(let r=0;r<kDots-1;r++)for(let c=0;c<kDots;c++)if(kV_lines[r][c]===0) moves.push({t:'v',r:r,c:c});
            
            for(let m of moves){
                if(isClosing(m)){ makeMove(m.t, m.r, m.c, 2); return; }
            }
            
            let safeMoves = moves.filter(m => !givesPoint(m));
            if(safeMoves.length>0){
                const m = safeMoves[Math.floor(Math.random()*safeMoves.length)]; 
                makeMove(m.t, m.r, m.c, 2);
            } else {
                const m = moves[Math.floor(Math.random()*moves.length)]; 
                makeMove(m.t, m.r, m.c, 2);
            }
        }

        function isClosing(m){
            let closes=false; 
            if(m.t==='h') kH_lines[m.r][m.c]=2; else kV_lines[m.r][m.c]=2;
            
            if(m.t==='h'){
                if(isBoxFull(m.r-1,m.c)) closes=true; 
                if(isBoxFull(m.r,m.c)) closes=true;
            } else {
                if(isBoxFull(m.r,m.c-1)) closes=true; 
                if(isBoxFull(m.r,m.c)) closes=true;
            }
            
            if(m.t==='h') kH_lines[m.r][m.c]=0; else kV_lines[m.r][m.c]=0; 
            return closes;
        }

        function givesPoint(m){
            let bad=false;
            if(m.t==='h'){
                if(countLines(m.r-1,m.c)===3) bad=true; 
                if(countLines(m.r,m.c)===3) bad=true;
            } else {
                if(countLines(m.r,m.c-1)===3) bad=true; 
                if(countLines(m.r,m.c)===3) bad=true;
            }
            return bad;
        }

        function isBoxFull(r,c){ 
            if(r<0 || r>=kDots-1 || c<0 || c>=kDots-1) return false;
            // Zählt nur für bespielbare Felder (0 oder bereits gewonnen)
            return kBoxes[r][c] >= 0 && kH_lines[r][c] > 0 && kH_lines[r+1][c] > 0 && kV_lines[r][c] > 0 && kV_lines[r][c+1] > 0; 
        }
        
        function countLines(r,c){ 
            if(r<0 || r>=kDots-1 || c<0 || c>=kDots-1) return -1;
            // Mauern (-1) oder Nichts (-2) geben nie einen Punkt
            if(kBoxes[r][c] < 0) return -1; 
            let cnt=0; 
            if(kH_lines[r][c]>0)cnt++; if(kH_lines[r+1][c]>0)cnt++; 
            if(kV_lines[r][c]>0)cnt++; if(kV_lines[r][c+1]>0)cnt++; 
            return cnt; 
        }

        function renderKlossi(){
            kCtx.clearRect(0,0,1000,1000); kCtx.lineWidth=4;
            
            for(let r=0;r<kDots-1;r++){
                for(let c=0;c<kDots-1;c++){
                    if(kBoxes[r][c] === -1) { 
                        // Die MAUERN: Dunkelgraue Hindernisse
                        kCtx.fillStyle='#333'; kCtx.fillRect(c*K_SIZE+5, r*K_SIZE+5, K_SIZE-10, K_SIZE-10); 
                    } else if(kBoxes[r][c]===1) { 
                        kCtx.fillStyle='#ff69b4'; kCtx.fillRect(c*K_SIZE, r*K_SIZE, K_SIZE, K_SIZE); 
                    } else if(kBoxes[r][c]===2) { 
                        kCtx.fillStyle='#ffd700'; kCtx.fillRect(c*K_SIZE, r*K_SIZE, K_SIZE, K_SIZE); 
                    }
                    // kBoxes === -2 (Nichts) oder 0 (Spielfeld) wird einfach gar nicht gefüllt (Hintergrund bleibt schwarz)
                }
            }
            
            for(let r=0;r<kDots;r++){
                for(let c=0;c<kDots-1;c++){
                    if(kH_lines[r][c] === -1) continue; 
                    if(kH_lines[r][c] > 0){
                        kCtx.beginPath(); kCtx.moveTo(c*K_SIZE, r*K_SIZE); kCtx.lineTo((c+1)*K_SIZE, r*K_SIZE); 
                        kCtx.strokeStyle = (kH_lines[r][c]===1)?'#ff69b4':'#ffd700'; 
                        kCtx.stroke();
                    } else {
                        kCtx.fillStyle='rgba(255,255,255,0.15)'; 
                        kCtx.beginPath(); kCtx.arc(c*K_SIZE+K_SIZE/2, r*K_SIZE, 2, 0, 6.28); kCtx.fill();
                    }
                }
            }
            
            for(let r=0;r<kDots-1;r++){
                for(let c=0;c<kDots;c++){
                    if(kV_lines[r][c] === -1) continue; 
                    if(kV_lines[r][c] > 0){
                        kCtx.beginPath(); kCtx.moveTo(c*K_SIZE, r*K_SIZE); kCtx.lineTo(c*K_SIZE, (r+1)*K_SIZE); 
                        kCtx.strokeStyle = (kV_lines[r][c]===1)?'#ff69b4':'#ffd700'; 
                        kCtx.stroke();
                    } else {
                        kCtx.fillStyle='rgba(255,255,255,0.15)'; 
                        kCtx.beginPath(); kCtx.arc(c*K_SIZE, r*K_SIZE+K_SIZE/2, 2, 0, 6.28); kCtx.fill();
                    }
                }
            }
            
            // Punkte zeichnen
            for(let r=0;r<kDots;r++){
                for(let c=0;c<kDots;c++){
                    let hasLine = false;
                    if(c < kDots-1 && kH_lines[r][c] !== -1) hasLine = true;
                    if(c > 0 && kH_lines[r][c-1] !== -1) hasLine = true;
                    if(r < kDots-1 && kV_lines[r][c] !== -1) hasLine = true;
                    if(r > 0 && kV_lines[r-1][c] !== -1) hasLine = true;

                    if(hasLine) {
                        kCtx.fillStyle='#fff'; kCtx.beginPath(); kCtx.arc(c*K_SIZE, r*K_SIZE, 5, 0, 6.28); kCtx.fill();
                    }
                }
            }
        }

        function updateKlossiUI(){
            document.getElementById('score-p').innerText=kScoreP; 
            document.getElementById('score-b').innerText=kScoreB;
            document.getElementById('sb-player').className = kTurn===1 ? 'score-box active' : 'score-box';
            document.getElementById('sb-bot').className = kTurn===2 ? 'score-box active' : 'score-box';
            document.getElementById('turn-indicator').innerText = kTurn===1 ? "Du bist dran!" : "Kloßi denkt...";
        }

        function showToast(txt){const t=document.getElementById('msg-toast');t.innerText=txt;t.style.display='block';setTimeout(()=>t.style.display='none',2500);}
    </script>
</body>
</html>
