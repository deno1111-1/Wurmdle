<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>🔢Numble</title>
    <style>
        :root {
            --bg-color: #121213;
            --text-color: #ffffff;
            --cell-bg: #121213;
            --cell-border: #3a3a3c;
            --cell-active-border: #565758;
            --key-bg: #818384;
            --color-correct: #538d4e; /* Grün */
            --color-present: #b59f3b; /* Gelb */
            --color-absent: #3a3a3c;  /* Grau */
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            user-select: none;
            touch-action: manipulation;
        }

        header {
            width: 100%;
            padding: 10px 15px;
            border-bottom: 1px solid var(--cell-border);
            display: flex;
            flex-direction: column;
            align-items: center;
            box-sizing: border-box;
            background: #1a1a1c;
        }
        
        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            max-width: 500px;
        }

        h1 { margin: 0; font-size: 1.5rem; font-weight: 700; letter-spacing: 2px; }
        
        .menu-btn {
            background: #333; color: white; border: 1px solid #555; text-decoration: none;
            padding: 8px 12px; border-radius: 5px; cursor: pointer; font-weight: bold; font-size: 0.8rem;
        }

        .target-display { margin-top: 8px; font-size: 1.3rem; font-weight: bold; color: #4ade80; }

        #toast-container {
            position: fixed; top: 90px; left: 50%; transform: translateX(-50%);
            z-index: 1000; display: flex; flex-direction: column; gap: 10px;
        }
        .toast {
            background: #e2e8f0; color: #0f172a; padding: 12px 20px;
            border-radius: 4px; font-weight: bold; font-size: 0.9rem;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            opacity: 1; transition: opacity 0.3s ease;
        }

        /* --- GRID --- */
        #board-container {
            display: flex; justify-content: center; align-items: center;
            flex-grow: 1; overflow: hidden; width: 100%; padding: 10px; box-sizing: border-box;
        }
        #board {
            display: grid; grid-template-rows: repeat(6, 1fr); gap: 5px;
        }
        .row {
            display: grid; grid-template-columns: repeat(8, 1fr); gap: 5px;
        }
        .cell {
            width: 8vw; height: 8vw; max-width: 45px; max-height: 45px;
            border: 2px solid var(--cell-border); border-radius: 4px;
            display: flex; justify-content: center; align-items: center;
            font-size: 1.8rem; font-weight: bold; background-color: var(--cell-bg);
            transition: transform 0.5s, background-color 0.5s, border-color 0.5s;
        }
        .cell.filled { border-color: var(--cell-active-border); animation: pop 0.1s; }

        @keyframes pop {
            0% { transform: scale(1); } 50% { transform: scale(1.1); } 100% { transform: scale(1); }
        }

        .cell.flip { transform: scaleY(0); }
        
        .correct { background-color: var(--color-correct) !important; border-color: var(--color-correct) !important; }
        .present { background-color: var(--color-present) !important; border-color: var(--color-present) !important; }
        .absent { background-color: var(--color-absent) !important; border-color: var(--color-absent) !important; }

        /* --- KEYBOARD --- */
        #keyboard {
            width: 100%; max-width: 500px; padding: 10px; box-sizing: border-box;
            display: flex; flex-direction: column; gap: 8px; margin-bottom: 20px;
        }
        .key-row { display: flex; justify-content: center; gap: 6px; }
        button.key {
            background-color: var(--key-bg); color: white; border: none;
            border-radius: 4px; font-size: 1.2rem; font-weight: bold;
            flex: 1; height: 50px; cursor: pointer; transition: background-color 0.2s;
            display: flex; justify-content: center; align-items: center;
        }
        button.key:active { filter: brightness(0.8); }
        button.key.wide { flex: 2; font-size: 1rem; }
    </style>
</head>
<body>

    <header>
        <div class="header-top">
            <h1>🔢NUMBLE</h1>
            <a href="index.html" class="menu-btn">🏠HAUPTMENÜ</a>
        </div>
        <div class="target-display" id="target-number">Zielzahl: ---</div>
    </header>

    <div id="toast-container"></div>

    <div id="board-container">
        <div id="board"></div>
    </div>

    <div id="keyboard">
        <div class="key-row">
            <button class="key" data-key="1">1</button>
            <button class="key" data-key="2">2</button>
            <button class="key" data-key="3">3</button>
            <button class="key" data-key="4">4</button>
            <button class="key" data-key="5">5</button>
            <button class="key" data-key="6">6</button>
            <button class="key" data-key="7">7</button>
            <button class="key" data-key="8">8</button>
            <button class="key" data-key="9">9</button>
            <button class="key" data-key="0">0</button>
        </div>
        <div class="key-row">
            <button class="key" data-key="+">+</button>
            <button class="key" data-key="-">-</button>
            <button class="key" data-key="*">*</button>
            <button class="key" data-key="/">/</button>
            <button class="key wide" data-key="Enter">EINGABE</button>
            <button class="key wide" data-key="Backspace">⌫</button>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
    <script src="stats.js"></script>
    <script>
        const ROWS = 6;
        const COLS = 8;
        let board = [];
        let currentRow = 0;
        let currentCol = 0;
        let secretEquation = "";
        let targetNumber = 0;
        let numbleInvalidCount = 0;
        let gameOver = false;

        // Generator für eine gültige 8-Zeichen Rechnung (Ergebnis max 200)
        function generateSecret() {
            const ops = ['+', '-', '*', '/'];
            const patterns = [
                [2, 2, 2], [3, 2, 1], [1, 3, 2], [2, 1, 3], [1, 2, 3], 
                [4, 3], [3, 4] 
            ];
            
            let attempts = 0;
            while(true) {
                attempts++;
                let p = patterns[Math.floor(Math.random() * patterns.length)];
                let expr = "";
                
                if (p.length === 3) {
                    let o1 = ops[Math.floor(Math.random()*ops.length)];
                    let o2 = ops[Math.floor(Math.random()*ops.length)];
                    expr = `${randLen(p[0])}${o1}${randLen(p[1])}${o2}${randLen(p[2])}`;
                } else {
                    let o1 = ops[Math.floor(Math.random()*ops.length)];
                    expr = `${randLen(p[0])}${o1}${randLen(p[1])}`;
                }
                
                try {
                    let res = eval(expr);
                    if (res > 0 && res <= 200 && res % 1 === 0 && expr.length === COLS && !/\b0\d+/.test(expr)) {
                        return { expr: expr, target: res };
                    }
                } catch(e) {} 
                
                if (attempts > 5000) {
                    return { expr: "100+15+5", target: 120 };
                }
            }
        }

        function randLen(len) {
            if (len === 1) return Math.floor(Math.random() * 10);
            let min = Math.pow(10, len-1);
            let max = Math.pow(10, len) - 1;
            return Math.floor(Math.random() * (max - min + 1)) + min;
        }

        function initGame() {
            const secret = generateSecret();
            secretEquation = secret.expr;
            targetNumber = secret.target;
            numbleInvalidCount = 0;
            startGameTimer();
            
            document.getElementById('target-number').innerText = `Zielzahl: ${targetNumber}`;

            const boardEl = document.getElementById('board');
            for (let r = 0; r < ROWS; r++) {
                let row = document.createElement('div');
                row.className = 'row';
                board[r] = [];
                for (let c = 0; c < COLS; c++) {
                    let cell = document.createElement('div');
                    cell.className = 'cell';
                    cell.id = `cell-${r}-${c}`;
                    row.appendChild(cell);
                    board[r].push(cell);
                }
                boardEl.appendChild(row);
            }

            document.querySelectorAll('.key').forEach(button => {
                button.addEventListener('click', () => handleInput(button.dataset.key));
            });

            document.addEventListener('keydown', (e) => {
                if (gameOver) return;
                let key = e.key;
                if (/^[0-9+\-*/]$/.test(key) || key === 'Enter' || key === 'Backspace') {
                    handleInput(key);
                }
            });
        }

        function handleInput(key) {
            if (gameOver) return;

            if (key === 'Backspace') {
                if (currentCol > 0) {
                    currentCol--;
                    let cell = board[currentRow][currentCol];
                    cell.innerText = "";
                    cell.classList.remove('filled');
                }
                return;
            }

            if (key === 'Enter') {
                submitRow();
                return;
            }

            if (currentCol < COLS && /^[0-9+\-*/]$/.test(key)) {
                let cell = board[currentRow][currentCol];
                cell.innerText = key;
                cell.classList.add('filled');
                currentCol++;
            }
        }

        function showToast(msg) {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = 'toast';
            toast.innerText = msg;
            container.appendChild(toast);
            setTimeout(() => {
                toast.style.opacity = '0';
                setTimeout(() => toast.remove(), 300);
            }, 2000);
        }

        function checkMathRules(expr) {
            if (expr.length !== COLS) return { valid: false, msg: "Reihe nicht voll!" };
            if (/[+\-*/]{2,}/.test(expr)) return { valid: false, msg: "Keine doppelten Rechenzeichen!" };
            if (/^[+\-*/]/.test(expr) || /[+\-*/]$/.test(expr)) return { valid: false, msg: "Rechnung darf nicht mit Zeichen starten/enden!" };
            if (/\b0\d+/.test(expr)) return { valid: false, msg: "Zahlen dürfen nicht mit 0 beginnen!" };
            
            try {
                let res = eval(expr);
                if (res !== targetNumber) return { valid: false, msg: `Das Ergebnis ist ${res}, nicht ${targetNumber}!` };
                return { valid: true };
            } catch(e) {
                return { valid: false, msg: "Ungültige Rechnung!" };
            }
        }

        function submitRow() {
            let guess = "";
            for (let c = 0; c < COLS; c++) {
                guess += board[currentRow][c].innerText;
            }

            let validation = checkMathRules(guess);
            if (!validation.valid) {
                numbleInvalidCount++;
                showToast(validation.msg);
                const rowEl = board[currentRow][0].parentElement;
                rowEl.style.transform = 'translateX(-5px)';
                setTimeout(() => rowEl.style.transform = 'translateX(5px)', 100);
                setTimeout(() => rowEl.style.transform = 'translateX(0)', 200);
                return;
            }

            let secretArr = secretEquation.split('');
            let guessArr = guess.split('');
            let cellColors = Array(COLS).fill('absent');

            for (let i = 0; i < COLS; i++) {
                if (guessArr[i] === secretArr[i]) {
                    cellColors[i] = 'correct';
                    secretArr[i] = null; 
                    guessArr[i] = null;
                }
            }

            for (let i = 0; i < COLS; i++) {
                if (guessArr[i] !== null && secretArr.includes(guessArr[i])) {
                    cellColors[i] = 'present';
                    secretArr[secretArr.indexOf(guessArr[i])] = null;
                }
            }

            for (let c = 0; c < COLS; c++) {
                setTimeout(() => {
                    let cell = board[currentRow][c];
                    cell.classList.add('flip');
                    
                    setTimeout(() => {
                        cell.classList.add(cellColors[c]);
                        updateKeyboard(board[currentRow][c].innerText, cellColors[c]);
                        cell.classList.remove('flip');
                    }, 250); 

                }, c * 150);
            }

            setTimeout(() => {
                if (guess === secretEquation) {
                    showToast("🎉 Perfekt gelöst!");
                    gameOver = true;
                    recordGameResult('numble', {won: true, guesses: currentRow + 1, maxGuesses: ROWS, extra: {invalid_count: numbleInvalidCount}});
                } else if (currentRow === ROWS - 1) {
                    showToast(`Schade! Die Lösung war: ${secretEquation}`);
                    gameOver = true;
                    recordGameResult('numble', {won: false, guesses: currentRow + 1, maxGuesses: ROWS, extra: {invalid_count: numbleInvalidCount}});
                } else {
                    currentRow++;
                    currentCol = 0;
                }
            }, COLS * 150 + 300);
        }

        function updateKeyboard(keyChar, colorStatus) {
            let keys = document.querySelectorAll('.key');
            for (let btn of keys) {
                if (btn.dataset.key === keyChar) {
                    if (btn.classList.contains('correct')) return;
                    if (btn.classList.contains('present') && colorStatus !== 'correct') return;
                    
                    btn.classList.remove('present', 'absent');
                    btn.classList.add(colorStatus);
                }
            }
        }

        initGame();
    </script>
</body>
</html>
