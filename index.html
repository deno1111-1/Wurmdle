<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
    <title>Lenis coole Spielesammlung</title>
    <style>
        /* --- GLOBAL --- */
        body {
            background-color: #121213; color: white;
            font-family: 'Comic Sans MS', 'Chalkboard SE', sans-serif;
            margin: 0; display: flex; flex-direction: column; align-items: center;
            height: 100vh; overflow: hidden; user-select: none;
            touch-action: none;
        }

        /* HEADER */
        header {
            display: flex; align-items: center; justify-content: center;
            width: 100%; padding: 15px; background: #121213; box-sizing: border-box;
            border-bottom: 1px solid #333; height: 60px; z-index: 10;
        }
        h1 { margin: 0; font-size: 1.2rem; color: #538d4e; text-shadow: 1px 1px 0 #000; }

        /* --- HAUPTMENÜ --- */
        #main-menu {
            position: absolute; top: 60px; left: 0; width: 100%; height: calc(100% - 60px);
            background: #121213; z-index: 200;
            display: flex; flex-direction: column; justify-content: flex-start; align-items: center; gap: 15px;
            overflow-y: auto; padding: 20px 0 40px 0; box-sizing: border-box;
        }
        
        .mode-card {
            background: #1e1e1f; border: 2px solid #538d4e; border-radius: 20px;
            padding: 15px 20px; width: 85%; max-width: 320px; text-align: left;
            cursor: pointer; transition: transform 0.1s; text-decoration: none; color: inherit;
            box-shadow: 0 5px 15px rgba(0,0,0,0.5); display: flex; flex-direction: row; align-items: center; gap: 15px;
            flex-shrink: 0;
        }
        
        .mode-card:hover { border-color: #fff; }
        .mode-card:active { transform: scale(0.95); }
        
        .mode-icon { font-size: 2.5rem; }
        .mode-info { flex-grow: 1; }
        .mode-title { font-size: 1.1rem; font-weight: bold; color: white; }
        .mode-desc { color: #888; font-size: 0.8rem; margin-top: 2px; }
    </style>
</head>
<body>

    <header>
        <h1>Lenis coole Spielesammlung 🎮</h1>
    </header>

    <div id="main-menu">
        <a href="wurmdle.html" class="mode-card">
            <div class="mode-icon">🐛</div>
            <div class="mode-info"><div class="mode-title">Wurmdle</div><div class="mode-desc">Errate das Wort! (DE/EN)</div></div>
        </a>
        <a href="lilly.html" class="mode-card">
            <div class="mode-icon">🐱</div>
            <div class="mode-info"><div class="mode-title">Lillys Spelling Game</div><div class="mode-desc">Finde die Wörter (DE/EN)</div></div>
        </a>
        <a href="schnecki.html" class="mode-card">
            <div class="mode-icon">🐌</div>
            <div class="mode-info"><div class="mode-title">Schneckis Wörter Box</div><div class="mode-desc">Verbinde die Buchstaben!</div></div>
        </a>
        <a href="klossi.html" class="mode-card">
            <div class="mode-icon">🐈</div>
            <div class="mode-info"><div class="mode-title">Kloßis Leckerlijagd</div><div class="mode-desc">Käsekästchen vs Kloßi</div></div>
        </a>
        <a href="krokel.html" class="mode-card">
            <div class="mode-icon">🐢🔥</div>
            <div class="mode-info"><div class="mode-title">Krokels Wörterbox</div><div class="mode-desc">Löse das Gitter!</div></div>
        </a>
        <a href="schneckerich.html" class="mode-card">
            <div class="mode-icon">🐌🧩</div>
            <div class="mode-info"><div class="mode-title">Schneckerichs Sortierspaß</div><div class="mode-desc">Finde 4 Gruppen!</div></div>
        </a>
    </div>

</body>
</html>
